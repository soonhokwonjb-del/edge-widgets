<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>시장 지표판</title>
<style>
  :root{--bg:#0b0d10;--card:#151a21;--line:#232a33;--fg:#e9edf2;--sub:#8b96a5;--up:#ff6b6b;--dn:#5aa9ff;--warn:#ffb14a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;gap:9px;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .top{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:10px 14px}
  .k{font-size:14px;color:var(--sub)}
  .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
  .s{font-size:14px;color:#c9d3df;margin-top:2px}
  .chg.up{color:var(--up)} .chg.dn{color:var(--dn)}
  .asof{font-size:12px;color:var(--sub);text-align:right;margin-top:-3px}
  .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:9px;min-height:0}
  .cell{position:relative;overflow:hidden;padding:4px}
  .cell .lbl{position:absolute;left:12px;top:8px;font-size:12px;color:var(--sub);z-index:2;pointer-events:none}
  .kr{padding:12px 14px;display:flex;flex-direction:column}
  .kr .kn{font-size:14px;font-weight:600}
  .kr .kp{font-size:15px;margin-top:2px}
  .kr .kp b{font-size:17px}
  .kr .up{color:#22ab94} .kr .dn{color:#f7525f}
  .kr svg{flex:1;width:100%;margin-top:6px}
  .krnote{font-size:11px;color:var(--sub);margin-top:2px}
  .tradingview-widget-container{width:100%;height:100%}
  .tradingview-widget-copyright{display:none}
</style>
</head>
<body>
  <div class="top">
    <div class="card tile">
      <div class="k">USD/IDR</div>
      <div class="v" id="usdidr">-</div>
      <div class="s chg" id="usdidrC"></div>
    </div>
    <div class="card tile">
      <div class="k">1루피아 = ? 원</div>
      <div class="v" id="krwidr">-</div>
      <div class="s" id="idr1m"></div>
    </div>
    <div class="card tile">
      <div class="k">USD/KRW</div>
      <div class="v" id="usdkrw">-</div>
      <div class="s chg" id="usdkrwC"></div>
    </div>
    <div class="card tile">
      <div class="k">BI-Rate</div>
      <div class="v" id="birate">6.00%</div>
      <div class="s" id="rdg"></div>
    </div>
  </div>
  <div class="asof" id="asof"></div>

  <div class="grid">
    <div class="card cell"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {"symbol":"IDX:COMPOSITE","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"dark","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":true}
      </script></div></div>
    <div class="card cell kr" id="kr0"><div class="kn">-</div><div class="kp"></div><svg class="spark" preserveAspectRatio="none"></svg></div>
    <div class="card cell"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {"symbol":"FX_IDC:USDIDR","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"dark","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":true}
      </script></div></div>
    <div class="card cell"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {"symbol":"FOREXCOM:SPXUSD","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"dark","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":true}
      </script></div></div>
    <div class="card cell"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {"symbol":"FOREXCOM:NSXUSD","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"dark","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":true}
      </script></div></div>
    <div class="card cell"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {"symbol":"TVC:UKOIL","width":"100%","height":"100%","locale":"kr","dateRange":"3M","colorTheme":"dark","isTransparent":true,"autosize":true,"largeChartUrl":"","chartOnly":false,"noTimeScale":true}
      </script></div></div>
  </div>

<script>
// BI-Rate: RDG 17-18 Nov 2026 결과 6.00%. 다음 RDG 15-16 Dec 2026 (결과 발표 16일)
const RDG=['2026-12-16'];
const nf=(n,d)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
function jktToday(){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return `${p.year}-${p.month}-${p.day}`;}
function renderRDG(){
  const t=jktToday(); const n=RDG.find(d=>d>=t);
  const el=document.getElementById('rdg');
  if(!n){el.textContent='다음 RDG 일정 갱신 필요';return;}
  const diff=Math.round((new Date(n)-new Date(t))/86400000);
  const [y,m,d]=n.split('-');
  el.textContent=`다음 RDG 결과 ${+m}/${+d} (${diff===0?'오늘':'D-'+diff})`;
}
function chg(el,cur,prev,dec){
  const e=document.getElementById(el); if(prev==null){e.textContent='';return;}
  const d=cur-prev, p=d/prev*100;
  e.className='s chg '+(d>0?'up':d<0?'dn':'');
  e.textContent=`${d>0?'▲':d<0?'▼':'-'} ${nf(Math.abs(d),dec)} (${p>0?'+':''}${p.toFixed(2)}%) 전일 대비`;
}
async function loadFX(){
  try{
    const end=new Date(); const start=new Date(end.getTime()-10*86400000);
    const s=start.toISOString().slice(0,10);
    const r=await (await fetch(`https://api.frankfurter.dev/v1/${s}..?base=USD&symbols=IDR,KRW`)).json();
    const days=Object.keys(r.rates).sort(); const last=days[days.length-1], prev=days[days.length-2];
    const L=r.rates[last], P=prev?r.rates[prev]:null;
    document.getElementById('usdidr').textContent=nf(L.IDR,0);
    chg('usdidrC',L.IDR,P&&P.IDR,0);
    document.getElementById('usdkrw').textContent=nf(L.KRW,1);
    chg('usdkrwC',L.KRW,P&&P.KRW,1);
    const krwidr=L.IDR/L.KRW;
    const idrkrw=1/krwidr;
    document.getElementById('krwidr').textContent=`${nf(idrkrw,4)}원`;
    document.getElementById('idr1m').textContent=`1만 루피아 = ${nf(1e4*idrkrw,0)}원 · 100만 루피아 = ${nf(1e6*idrkrw,0)}원`;
    const [y,m,d]=last.split('-');
    document.getElementById('asof').textContent=`환율 기준일 ${+m}/${+d} (ECB 고시) · 차트 3개월`;
  }catch(e){document.getElementById('asof').textContent='환율을 불러오지 못함';}
}

async function loadKR(){
  try{
    const j=await (await fetch('kr.json?t='+Date.now())).json();
    j.items.forEach((it,i)=>{
      const el=document.getElementById('kr'+i); if(!el) return;
      const d=it.prev?it.price-it.prev:0, p=it.prev?d/it.prev*100:0;
      const dec=it.price<10000&&it.name==='KOSPI'?2:0;
      el.querySelector('.kn').textContent=it.name;
      const t=new Date(it.time*1000).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      el.querySelector('.kp').innerHTML=`<b>${nf(it.price,dec)}</b> <span class="${d>=0?'up':'dn'}">${p>=0?'+':''}${p.toFixed(2)}%</span> <span class="krnote">${t} KST</span>`;
      const c=it.closes, mn=Math.min(...c), mx=Math.max(...c), W=300, H=100;
      const pts=c.map((v,k)=>`${(k/(c.length-1)*W).toFixed(1)},${(H-(v-mn)/(mx-mn||1)*H*0.9-H*0.05).toFixed(1)}`).join(' ');
      const col=c[c.length-1]>=c[0]?'#22ab94':'#f7525f';
      const svg=el.querySelector('svg'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      svg.innerHTML=`<defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${pts} ${W},${H}" fill="url(#g${i})"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
    });
  }catch(e){[0].forEach(i=>{const el=document.getElementById('kr'+i); if(el) el.querySelector('.kn').textContent='국내 시세 준비 중';});}
}
renderRDG(); loadFX(); loadKR(); setInterval(loadKR,10*60*1000);
setInterval(()=>{renderRDG();loadFX();},60*60*1000);
setTimeout(()=>location.reload(),6*60*60*1000);
</script>
</body>
</html>
