<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>캘린더</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden}
  .wrap{position:absolute;inset:12px;border-radius:14px;overflow:hidden;background:#fff}
  iframe{width:100%;height:100%;border:0;filter:invert(0.9) hue-rotate(180deg) contrast(0.95)}
</style>
</head>
<body>
<div class="wrap"><iframe id="cal"></iframe></div>
<script>
const SRC=['soonho.kwon.jb@gmail.com',
 '822da5379bb5b16975972adfd5a86dd4a77f4bb58fe9b881685b08512a83c08e@group.calendar.google.com',
 'c1c0c1383438d28436b0fae7a495584ba9668b7b20f383867382731ad8dd6e6d@group.calendar.google.com',
 '30cd9d4405814b48443304f641daa4b9467cdfbb25aa4742ce9ebde875ae8528@group.calendar.google.com',
 'ko.indonesian#holiday@group.v.calendar.google.com',
 'ko.south_korea#holiday@group.v.calendar.google.com'];
const mode=(new URLSearchParams(location.search).get('mode')||'MONTH').toUpperCase();
const q='mode='+mode+'&ctz=Asia%2FJakarta&hl=ko&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0&'+SRC.map(s=>'src='+encodeURIComponent(s)).join('&');
const f=document.getElementById('cal');
function load(){f.src='https://calendar.google.com/calendar/embed?'+q+'&_='+Date.now();}
load();
// 날짜가 바뀌거나 일정이 추가된 것을 반영하도록 30분마다 새로 불러옴
setInterval(load,30*60*1000);
</script>
</body>
</html>
