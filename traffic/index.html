<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교통</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0d10;color:#e9edf2;font-family:"Pretendard","Malgun Gothic",sans-serif;overflow:hidden;user-select:none}
  body{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
  .bar{display:flex;gap:6px}
  .b{flex:1;height:40px;border-radius:10px;border:1px solid #232a33;background:#151a21;color:#c9d3df;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
  .b.on{background:#1f3550;border-color:#2f5d8f;color:#fff}
  .map{flex:1;border-radius:14px;overflow:hidden;position:relative;background:#111}
  iframe{width:100%;height:100%;border:0;filter:invert(0.9) hue-rotate(180deg) contrast(0.95)}
  .note{position:absolute;right:10px;bottom:8px;font-size:11px;color:#8b96a5;background:rgba(11,13,16,.7);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="map"><iframe id="m" allow="geolocation 'none'"></iframe><div class="note">Waze 실시간 교통 · 빨간색일수록 정체</div></div>
<script>
// 지역별 보기 (위치는 지역 단위로만 지정)
const AREAS=[
  {n:'블록엠·케바요란', lat:-6.2350, lon:106.8000, z:14},
  {n:'수디르만·탐린', lat:-6.2050, lon:106.8220, z:13},
  {n:'자카르타 남부', lat:-6.2400, lon:106.8100, z:12},
  {n:'공항 방면', lat:-6.1500, lon:106.7300, z:11}
];
const bar=document.getElementById('bar'), m=document.getElementById('m');
let sel=0;
function go(i){
  sel=i; const a=AREAS[i];
  m.src=`https://embed.waze.com/iframe?zoom=${a.z}&lat=${a.lat}&lon=${a.lon}&ct=livemap&pin=0`;
  [...bar.children].forEach((b,k)=>b.classList.toggle('on',k===i));
}
AREAS.forEach((a,i)=>{const b=document.createElement('div');b.className='b';b.textContent=a.n;b.addEventListener('pointerdown',()=>go(i));bar.appendChild(b);});
go(0);
// 교통 정보가 오래되지 않도록 10분마다 다시 불러옴
setInterval(()=>go(sel),10*60*1000);
</script>
</body>
</html>
