name: kr-quotes
on:
  schedule:
    - cron: "*/30 0-7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/kr_quotes.py
      - run: |
          git config user.name "kr-quotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market/kr.json
          git diff --cached --quiet || (git commit -m "update kr quotes" && git push)
